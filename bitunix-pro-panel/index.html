<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitunix Pro Panel V2</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;background:#0b0f10;color:#e9efef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1280px;margin:auto}.top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.search{position:relative;flex:1;min-width:300px;max-width:480px}.search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #293436;background:#12191a;color:#fff}.suggest{position:absolute;top:48px;left:0;right:0;background:#12191a;border:1px solid #293436;border-radius:12px;display:none;z-index:10;max-height:300px;overflow:auto}.suggest.open{display:block}.s{padding:10px 12px;border-bottom:1px solid #20292b;cursor:pointer}.s:hover{background:#192224}.muted{color:#91a0a0}.pos{color:#3ddc97}.neg{color:#ff7c86}.warn{color:#f0c36a}.danger{color:#ff6b76;font-weight:700}.risk-normal{color:#8ed5b0}.risk-high{color:#f0c36a}.risk-very-high{color:#ff9a61;font-weight:700}.risk-extreme{color:#ff6672;font-weight:800}.risk-unknown{color:#9ca7a7}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}.b-low{background:#20282a;color:#a3acad}.b-normal{background:#1d3028;color:#8ed5b0}.b-high{background:#3b321c;color:#f0c36a}.b-extreme{background:#3b2023;color:#ff8f98}button{padding:9px 12px;border:0;border-radius:10px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px;background:#111718;border-radius:14px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #253032;text-align:right;font-size:14px;vertical-align:top}th{background:#151d1e}tr{cursor:pointer}tr:hover{background:#172021}.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modalbg.open{display:flex}.modal{width:min(940px,100%);max-height:92vh;overflow:auto;background:#111718;border:1px solid #2a3638;border-radius:18px}.head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #263032;position:sticky;top:0;background:#111718;z-index:2}.body{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:12px;background:#151d1e;border:1px solid #253032;border-radius:12px}.k{font-size:12px;color:#91a0a0}.v{margin-top:4px}.tfbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tf{background:#212b2d;color:#cbd6d6}.tf.active{background:#e1e8e8;color:#111}.chartbox{margin-top:12px;padding:14px;background:#151d1e;border:1px solid #253032;border-radius:12px}canvas{width:100%;background:#0d1314;border-radius:10px}.pricecanvas{height:180px}.volcanvas{height:100px;margin-top:10px}.rsicanvas{height:120px;margin-top:10px}.volstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.analysis{margin-top:12px;padding:14px;background:#101617;border:1px solid #263234;border-radius:12px;line-height:1.8}.rsirow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.candidate{margin-top:12px;padding:12px;border:1px solid #3a3131;border-radius:12px;background:#171111}@media(max-width:900px){table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:760px){body{padding:12px}.grid,.volstats,.rsirow{grid-template-columns:1fr}.search{min-width:100%}}</style></head><body>
<div class="wrap"><div class="top"><div><h2 style="margin:0 0 4px">Bitunix Pro Panel V2</h2><div class="muted">Top 5 Futures + Funding Risk + Search + Volume + RSI</div></div><div class="search"><input id="q" placeholder="مثلاً AKE یا FLOCK یا BTC"><div id="suggest" class="suggest"></div></div><button onclick="loadTop()">بروزرسانی</button></div><div id="toplist">در حال دریافت...</div><div id="candidateBox"></div></div>
<div id="modalbg" class="modalbg" onclick="if(event.target===modalbg)closeModal()"><div class="modal"><div class="head"><h3 id="title">جزئیات</h3><button onclick="closeModal()">×</button></div><div id="body" class="body"></div></div></div>
<script>
let symbols=[],active='',tf='5m',candles=[];
const p=x=>x==null?'—':(x>=0?'+':'')+Number(x).toFixed(2)+'%',f=(x,d=8)=>x==null?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:d}),compact=x=>x==null?'—':Number(x).toLocaleString('en-US',{notation:'compact',maximumFractionDigits:2});
function riskClass(level){return 'risk-'+String(level||'unknown')}
function fundingText(x){return x==null?'داده معتبر در دسترس نیست':f(x,8)+'%'}
function intervalText(x){return x==null?'داده معتبر در دسترس نیست':f(x,4)+'h'}
function spikeLabel(v){if(v==null)return['—','b-low'];if(v>100)return['Extreme','b-extreme'];if(v>40)return['High','b-high'];if(v<-30)return['Low','b-low'];return['Normal','b-normal']}
function rsiLabel(v){if(v==null)return['—','muted'];if(v>=80)return['Extreme Overbought','neg'];if(v>=70)return['Overbought / Strong','warn'];if(v>=50)return['Bullish','pos'];if(v>30)return['Neutral / Weak','muted'];if(v>20)return['Oversold','warn'];return['Extreme Oversold','neg']}
async function initSymbols(){try{const r=await fetch('/api/symbols'),j=await r.json();symbols=j.symbols||[]}catch{}}
q.oninput=()=>{const s=q.value.trim().toUpperCase();if(!s){suggest.classList.remove('open');return}const m=symbols.filter(x=>x.symbol.includes(s)).slice(0,12);suggest.innerHTML=m.map(x=>'<div class="s" onclick="openSymbol(\''+x.symbol+'\')"><b>'+x.symbol+'</b> &nbsp; '+p(x.change24hPct)+'</div>').join('');suggest.classList.toggle('open',m.length>0)}
async function loadTop(){toplist.innerHTML='در حال دریافت...';candidateBox.innerHTML='';const r=await fetch('/api/scan?t='+Date.now()),j=await r.json();if(!r.ok){toplist.innerHTML='خطا در دریافت Top 5';return}toplist.innerHTML='<table><thead><tr><th>#</th><th>Symbol</th><th>24h</th><th>Price</th><th>24h Volume</th><th>Funding</th><th>Interval</th><th>ریسک Funding</th></tr></thead><tbody>'+j.top5.map((x,i)=>'<tr onclick="openSymbol(\''+x.symbol+'\')"><td>'+(i+1)+'</td><td><b>'+x.symbol+'</b></td><td class="'+(x.change24hPct>=0?'pos':'neg')+'">'+p(x.change24hPct)+'</td><td>'+f(x.lastPrice)+'</td><td>'+compact(x.quoteVol24h)+'</td><td>'+fundingText(x.fundingRate)+'</td><td>'+intervalText(x.fundingIntervalHours)+'</td><td class="'+riskClass(x.fundingRiskLevel)+'">'+x.fundingRisk+(x.candidateNote?'<div class="muted" style="margin-top:4px">'+x.candidateNote+'</div>':'')+'</td></tr>').join('')+'</tbody></table>';
const blocked=j.top5.filter(x=>x.fundingRiskLevel==='extreme');const good=j.candidates||[];candidateBox.innerHTML='<div class="candidate"><b>کاندیدهای پیش‌فرض برای بررسی بیشتر:</b> '+(good.length?good.map(x=>x.symbol).join('، '):'مورد مناسبی نیست')+(blocked.length?'<div class="danger" style="margin-top:6px">'+blocked.map(x=>x.symbol+': ریسک Funding بسیار بالاست؛ برای معامله ترجیحاً کنار گذاشته شود.').join('<br>')+'</div>':'')+'</div>'}
async function openSymbol(s){active=s;q.value=s;suggest.classList.remove('open');modalbg.classList.add('open');body.innerHTML='در حال دریافت...';title.textContent=s;const r=await fetch('/api/detail?symbol='+encodeURIComponent(s)+'&t='+Date.now()),x=await r.json();if(!r.ok){body.innerHTML='خطا';return}const dh=(x.high24h&&x.lastPrice)?((x.lastPrice-x.high24h)/x.high24h)*100:null,dl=(x.low24h&&x.lastPrice)?((x.lastPrice-x.low24h)/x.low24h)*100:null;body.innerHTML='<div class="grid">'+card('24h',p(x.change24hPct),x.change24hPct>=0?'pos':'neg')+card('Price',f(x.lastPrice))+card('24h Volume',compact(x.quoteVol24h))+card('Funding',fundingText(x.fundingRate))+card('Funding Interval',intervalText(x.fundingIntervalHours))+card('30-day filter',x.eligible30d?'✅ Passed':'❌ Failed',x.eligible30d?'pos':'neg')+card('24h High',f(x.high24h))+card('Distance from 24h High',p(dh),dh<0?'neg':'pos')+card('24h Low',f(x.low24h))+card('Distance from 24h Low',p(dl))+card('ATH Bitunix Futures',f(x.athBitunixFutures))+card('Distance from ATH',p(x.distanceFromAthPct),x.distanceFromAthPct<0?'neg':'pos')+card('ATH Date',x.athBitunixFuturesTime?new Date(x.athBitunixFuturesTime).toLocaleDateString():'—')+'</div><div class="chartbox"><div class="tfbar">'+['1m','5m','15m','1h','4h','1d','1w','1M'].map(z=>'<button class="tf '+(z===tf?'active':'')+'" onclick="changeTf(\''+z+'\')">'+z+'</button>').join('')+'</div><div class="muted" style="margin-bottom:6px">Price</div><canvas id="chart" class="pricecanvas" width="900" height="180"></canvas><div class="muted" style="margin:12px 0 6px">Volume per candle</div><canvas id="volchart" class="volcanvas" width="900" height="100"></canvas><div id="volstats" class="volstats"></div><div class="muted" style="margin:14px 0 6px">RSI(14) — Live, main 20 / 80, secondary 30 / 70</div><canvas id="rsichart" class="rsicanvas" width="900" height="120"></canvas><div id="rsistats" class="rsirow"></div><div id="analysis" class="analysis">در حال تحلیل...</div></div>';loadKline()}
function card(k,v,cls=''){return'<div class="card"><div class="k">'+k+'</div><div class="v '+cls+'">'+v+'</div></div>'}
function changeTf(z){tf=z;document.querySelectorAll('.tf').forEach(b=>b.classList.toggle('active',b.textContent===tf));loadKline()}
async function loadKline(){const r=await fetch('/api/kline?symbol='+encodeURIComponent(active)+'&interval='+tf+'&limit=120&t='+Date.now()),j=await r.json();candles=j.candles||[];drawPrice();drawVolume();const rsis=calcRSI(candles.map(x=>Number(x.close)),14);drawRSI(rsis);analyze(rsis)}
function drawPrice(){const c=document.getElementById('chart');if(!c||candles.length<2)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const vals=candles.map(x=>Number(x.close)),min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;ctx.beginPath();vals.forEach((v,i)=>{const x=i*(w/(vals.length-1)),y=h-((v-min)/span)*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#d9e3e3';ctx.lineWidth=2;ctx.stroke()}
function drawVolume(){const c=document.getElementById('volchart');if(!c||candles.length<2)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const closed=candles.filter(x=>x.isClosed!==false),vals=closed.map(x=>Number(x.volume)||0),max=Math.max(...vals)||1,bw=w/closed.length;closed.forEach((x,i)=>{const v=Number(x.volume)||0,bh=Math.max(1,(v/max)*(h-4)),up=Number(x.close)>=Number(x.open);ctx.fillStyle=up?'#3ddc97':'#ff7c86';ctx.globalAlpha=.75;ctx.fillRect(i*bw+1,h-bh,Math.max(1,bw-2),bh)});ctx.globalAlpha=1}
function calcRSI(closes,period=14){const out=Array(closes.length).fill(null);if(closes.length<=period)return out;let gains=0,losses=0;for(let i=1;i<=period;i++){const d=closes[i]-closes[i-1];if(d>=0)gains+=d;else losses-=d}let avgGain=gains/period,avgLoss=losses/period;out[period]=avgLoss===0?100:100-(100/(1+avgGain/avgLoss));for(let i=period+1;i<closes.length;i++){const d=closes[i]-closes[i-1],g=d>0?d:0,l=d<0?-d:0;avgGain=(avgGain*(period-1)+g)/period;avgLoss=(avgLoss*(period-1)+l)/period;out[i]=avgLoss===0?100:100-(100/(1+avgGain/avgLoss))}return out}
function drawRSI(rsis){const c=document.getElementById('rsichart');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const y=v=>h-(v/100)*h;[[80,'#ff7c86',1.5],[70,'#a77b4a',1],[30,'#557a86',1],[20,'#6aa3b8',1.5]].forEach(a=>{ctx.beginPath();ctx.moveTo(0,y(a[0]));ctx.lineTo(w,y(a[0]));ctx.strokeStyle=a[1];ctx.globalAlpha=.65;ctx.lineWidth=a[2];ctx.stroke()});ctx.globalAlpha=1;const pts=[];rsis.forEach((v,i)=>{if(v!=null)pts.push([i*(w/(rsis.length-1)),y(v)])});if(!pts.length)return;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle='#e0e6e6';ctx.lineWidth=2;ctx.stroke()}
function findBearishDiv(rsis){const pts=[];for(let i=2;i<candles.length-2;i++){if(candles[i].high>candles[i-1].high&&candles[i].high>=candles[i+1].high&&rsis[i]!=null)pts.push(i)}if(pts.length<2)return false;const b=pts.at(-1),a=pts.slice(0,-1).reverse().find(i=>b-i>=3&&b-i<=30);if(a==null)return false;return Number(candles[b].high)>Number(candles[a].high)&&rsis[b]<rsis[a]}
function analyze(rsis){if(candles.length<20){analysis.innerHTML='داده کافی نیست';return}const closed=candles.filter(x=>x.isClosed!==false),cfg=(tf==='1m'||tf==='5m')?{recent:5,base:30}:(tf==='15m'||tf==='1h')?{recent:3,base:24}:{recent:2,base:20};const recent=closed.slice(-cfg.recent),base=closed.slice(-(cfg.base+cfg.recent),-cfg.recent),vols=a=>a.map(x=>Number(x.volume)).filter(Number.isFinite),avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,rv=avg(vols(recent)),bv=avg(vols(base)),ratio=bv?rv/bv:null,spike=ratio!=null?(ratio-1)*100:null,last=recent.at(-1),priceMove=recent.length?((Number(last.close)-Number(recent[0].open))/Number(recent[0].open))*100:null,prev=closed.slice(-(cfg.recent*2),-cfg.recent),pv=avg(vols(prev)),volTrend=pv?((rv-pv)/pv)*100:null;let up=0,down=0;for(const x of recent){const v=Number(x.volume);if(Number(x.close)>=Number(x.open))up+=v;else down+=v}const sellShare=(up+down)?down/(up+down)*100:50;let score=0,notes=[];if(ratio>=2){score+=25;notes.push('Recent volume حدود '+ratio.toFixed(2)+'× baseline است.')}else if(ratio>=1.4){score+=15;notes.push('Recent volume بالاتر از baseline است.')}else if(ratio<0.7){notes.push('حجم اخیر ضعیف‌تر از baseline است.')}if(priceMove>1.5&&volTrend<0){score+=20;notes.push('قیمت بالا رفته ولی حجم افت کرده؛ واگرایی حجمی.')}if(priceMove<-1.5&&volTrend>20){score+=20;notes.push('قیمت افت کرده و حجم در حال افزایش است؛ فشار فروش محتمل‌تر.')}if(sellShare>60){score+=15;notes.push('سهم حجم کندل‌های نزولی بالاست ('+sellShare.toFixed(0)+'%).')}if(ratio>=1.5&&Math.abs(priceMove)<0.6){score+=20;notes.push('حجم بالاست اما حرکت قیمت کم است؛ Absorption/Distribution محتمل.')}const rsiLive=rsis.at(-1),closedIndex=candles.map((x,i)=>x.isClosed!==false?i:null).filter(x=>x!==null).at(-1),rsiClosed=closedIndex!=null?rsis[closedIndex]:null,[rlabel,rcls]=rsiLabel(rsiLive),bearDiv=findBearishDiv(rsis);if(rsiLive>=80){score+=10;notes.push('RSI Live وارد Extreme Overbought شده (≥80).')}else if(rsiLive>=70){notes.push('RSI Live بالای 70 است و مومنتوم هنوز قوی محسوب می‌شود.')}if(bearDiv){score+=20;notes.push('Bearish RSI Divergence شناسایی شده.')}let status='🟢 ادامه مومنتوم / خنثی',cls='pos';if(score>=60){status='🔴 Distribution / Rejection Risk';cls='neg'}else if(score>=35){status='🟠 Watch — ضعف حجمی / RSI';cls='warn'}const[sl,bc]=spikeLabel(spike);volstats.innerHTML='<div class="card"><div class="k">Recent / Baseline</div><div class="v">'+(ratio==null?'—':ratio.toFixed(2)+'×')+'</div></div><div class="card"><div class="k">Spike</div><div class="v">'+p(spike)+' <span class="badge '+bc+'">'+sl+'</span></div></div><div class="card"><div class="k">Volume Trend</div><div class="v">'+p(volTrend)+'</div></div>';rsistats.innerHTML='<div class="card"><div class="k">RSI(14) Live</div><div class="v '+rcls+'">'+(rsiLive==null?'—':rsiLive.toFixed(2))+' — '+rlabel+'</div></div><div class="card"><div class="k">RSI Last Closed Candle</div><div class="v">'+(rsiClosed==null?'—':rsiClosed.toFixed(2))+'</div></div><div class="card"><div class="k">Bearish RSI Divergence</div><div class="v '+(bearDiv?'neg':'muted')+'">'+(bearDiv?'⚠️ Detected':'Not detected')+'</div></div>';analysis.innerHTML='<div class="'+cls+'"><b>'+status+'</b> — Score '+Math.min(100,score)+'/100</div><div style="margin-top:8px">TF: <b>'+tf+'</b> | Recent: <b>'+cfg.recent+'</b> closed candles | Baseline: <b>'+cfg.base+'</b></div><div>Price move: <b>'+p(priceMove)+'</b> | Sell-volume share: <b>'+sellShare.toFixed(0)+'%</b> | RSI Live: <b>'+(rsiLive==null?'—':rsiLive.toFixed(2))+'</b> | RSI Closed: <b>'+(rsiClosed==null?'—':rsiClosed.toFixed(2))+'</b></div><ul>'+notes.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}
function closeModal(){modalbg.classList.remove('open');active='';candles=[]}
initSymbols();loadTop();
</script></body></html>
