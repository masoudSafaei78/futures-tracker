<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitunix Pro Panel V2</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;background:#0b0f10;color:#e9efef;font-family:system-ui}.wrap{max-width:1280px;margin:auto}.top{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.search{position:relative;min-width:300px}.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #293436;background:#12191a;color:#fff}.suggest{position:absolute;top:46px;inset-inline:0;background:#12191a;border:1px solid #293436;display:none;z-index:10}.suggest.open{display:block}.s{padding:9px;cursor:pointer}.muted{color:#91a0a0}.pos{color:#3ddc97}.neg{color:#ff7c86}.warn{color:#f0c36a}.danger{color:#ff6672;font-weight:700}button{padding:9px 12px;border:0;border-radius:9px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px;background:#111718}th,td{padding:10px;border-bottom:1px solid #253032;text-align:right}tr{cursor:pointer}.box{margin-top:14px;padding:12px;background:#12191a;border:1px solid #293436;border-radius:12px}.modalbg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}.modalbg.open{display:flex}.modal{width:min(950px,100%);max-height:92vh;overflow:auto;background:#111718;border-radius:16px}.head{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #293436}.body{padding:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:11px;background:#151d1e;border:1px solid #253032;border-radius:10px}.k{font-size:12px;color:#91a0a0}.tfbar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tf.active{background:#e1e8e8}.chart{margin-top:12px;padding:12px;background:#151d1e;border-radius:12px}canvas{width:100%;background:#0d1314;border-radius:8px}@media(max-width:700px){body{padding:10px}.grid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="wrap"><div class="top"><div><h2>Bitunix Pro Panel V2</h2><div class="muted">Top 5 Futures + Funding Risk + Volume + RSI</div></div><div class="search"><input id="q" placeholder="مثلاً BTC یا AKE"><div id="suggest" class="suggest"></div></div><button onclick="loadTop()">بروزرسانی</button></div><div id="top">در حال دریافت...</div><div id="candidates" class="box"></div></div><div id="modalbg" class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="head"><b id="title">جزئیات</b><button onclick="closeModal()">×</button></div><div id="body" class="body"></div></div></div><script>let symbols=[],active='',tf='5m',candles=[];const E=id=>document.getElementById(id),pct=x=>x==null?'—':(x>=0?'+':'')+Number(x).toFixed(2)+'%',num=(x,d=8)=>x==null?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:d}),compact=x=>x==null?'—':Number(x).toLocaleString('en-US',{notation:'compact',maximumFractionDigits:2}),fund=x=>x==null?'—':num(x,8)+'%';function card(k,v,c=''){return '<div class="card"><div class="k">'+k+'</div><div class="'+c+'">'+v+'</div></div>'}async function init(){try{let j=await(await fetch('/api/symbols')).json();symbols=j.symbols||[]}catch{}}E('q').oninput=()=>{let s=E('q').value.trim().toUpperCase(),m=symbols.filter(x=>x.symbol.includes(s)).slice(0,12);E('suggest').innerHTML=m.map(x=>'<div class="s" onclick="openSymbol(\''+x.symbol+'\')"><b>'+x.symbol+'</b> '+pct(x.change24hPct)+'</div>').join('');E('suggest').classList.toggle('open',!!s&&m.length>0)};async function loadTop(){E('top').textContent='در حال دریافت...';try{let r=await fetch('/api/scan?t='+Date.now()),j=await r.json();if(!r.ok)throw 0;E('top').innerHTML='<table><thead><tr><th>#</th><th>Symbol</th><th>24h</th><th>Price</th><th>Volume</th><th>Funding</th><th>Interval</th><th>ریسک Funding</th></tr></thead><tbody>'+j.top5.map((x,i)=>'<tr onclick="openSymbol(\''+x.symbol+'\')"><td>'+(i+1)+'</td><td><b>'+x.symbol+'</b></td><td class="'+(x.change24hPct>=0?'pos':'neg')+'">'+pct(x.change24hPct)+'</td><td>'+num(x.lastPrice)+'</td><td>'+compact(x.quoteVol24h)+'</td><td>'+fund(x.fundingRate)+'</td><td>'+(x.fundingIntervalHours==null?'—':num(x.fundingIntervalHours,2)+'h')+'</td><td class="'+(x.fundingRiskLevel==='extreme'?'danger':x.fundingRiskLevel==='high'||x.fundingRiskLevel==='very-high'?'warn':'')+'">'+x.fundingRisk+'</td></tr>').join('')+'</tbody></table>';E('candidates').innerHTML='<b>کاندیدهای بررسی بیشتر:</b> '+(j.candidates?.length?j.candidates.map(x=>x.symbol).join('، '):'مورد مناسبی نیست')}catch{E('top').innerHTML='<span class="neg">خطا در دریافت داده</span>'}}async function openSymbol(s){active=s;E('suggest').classList.remove('open');E('modalbg').classList.add('open');E('title').textContent=s;E('body').textContent='در حال دریافت...';let r=await fetch('/api/detail?symbol='+encodeURIComponent(s)),x=await r.json();if(!r.ok){E('body').textContent='خطا';return}let dh=x.high24h?((x.lastPrice-x.high24h)/x.high24h)*100:null;E('body').innerHTML='<div class="grid">'+card('24h',pct(x.change24hPct),x.change24hPct>=0?'pos':'neg')+card('Price',num(x.lastPrice))+card('24h Volume',compact(x.quoteVol24h))+card('Funding',fund(x.fundingRate))+card('Funding Interval',x.fundingIntervalHours==null?'—':num(x.fundingIntervalHours,2)+'h')+card('30-day filter',x.eligible30d?'✅ Passed':'❌ Failed')+card('24h High',num(x.high24h))+card('Distance from 24h High',pct(dh))+card('ATH Bitunix Futures',num(x.athBitunixFutures))+card('Distance from ATH',pct(x.distanceFromAthPct))+'</div><div class="chart"><div class="tfbar">'+['1m','5m','15m','1h','4h','1d','1w','1M'].map(z=>'<button class="tf '+(z===tf?'active':'')+'" onclick="changeTf(\''+z+'\')">'+z+'</button>').join('')+'</div><canvas id="chart" width="900" height="180"></canvas><div id="stats" class="box"></div></div>';loadKline()}function changeTf(z){tf=z;document.querySelectorAll('.tf').forEach(b=>b.classList.toggle('active',b.textContent===tf));loadKline()}async function loadKline(){let j=await(await fetch('/api/kline?symbol='+active+'&interval='+tf+'&limit=120&t='+Date.now())).json();candles=j.candles||[];draw();let r=calcRSI(candles.map(x=>Number(x.close))),live=r.at(-1),closed=candles.map((x,i)=>x.isClosed!==false?i:null).filter(x=>x!=null).at(-1),rc=closed==null?null:r[closed];E('stats').innerHTML='RSI(14) Live: <b>'+(live==null?'—':live.toFixed(2))+'</b> | Last Closed: <b>'+(rc==null?'—':rc.toFixed(2))+'</b> | TF: <b>'+tf+'</b>'}function draw(){let c=E('chart');if(!c||candles.length<2)return;let ctx=c.getContext('2d'),v=candles.map(x=>Number(x.close)),mi=Math.min(...v),ma=Math.max(...v),sp=ma-mi||1;ctx.clearRect(0,0,c.width,c.height);ctx.beginPath();v.forEach((z,i)=>{let x=i*c.width/(v.length-1),y=c.height-(z-mi)/sp*c.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#d9e3e3';ctx.lineWidth=2;ctx.stroke()}function calcRSI(a,p=14){let o=Array(a.length).fill(null);if(a.length<=p)return o;let g=0,l=0;for(let i=1;i<=p;i++){let d=a[i]-a[i-1];d>=0?g+=d:l-=d}let ag=g/p,al=l/p;o[p]=al===0?100:100-100/(1+ag/al);for(let i=p+1;i<a.length;i++){let d=a[i]-a[i-1],gg=d>0?d:0,ll=d<0?-d:0;ag=(ag*(p-1)+gg)/p;al=(al*(p-1)+ll)/p;o[i]=al===0?100:100-100/(1+ag/al)}return o}function closeModal(){E('modalbg').classList.remove('open')}init();loadTop();</script></body></html>
