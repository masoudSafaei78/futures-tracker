<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سرمایه</title><style>:root{font-family:Tahoma,Arial;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#edf3fc}.wrap{max-width:1150px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel,.stat{background:#111d31;border:1px solid #293a53;border-radius:15px;padding:15px}.big{font-size:27px;font-weight:800}.row{display:flex;justify-content:space-between;border-top:1px solid #293a53;padding:7px 0}.earn{color:#60a5fa}.good{color:#4ade80}.warn{color:#fbbf24}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat b{display:block;font-size:20px}.panel{margin-top:13px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,textarea,button{width:100%;padding:10px;border-radius:9px;border:1px solid #3a4c66;background:#0b1424;color:#fff;font:inherit}label{display:block;font-size:13px;color:#cbd5e1;margin:4px}button{background:#2563eb;font-weight:bold;cursor:pointer}.hidden{display:none}.overlay{position:fixed;inset:0;background:#050a13f2;display:flex;align-items:center;justify-content:center;z-index:20}.login{width:min(390px,90%)}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid #293a53;text-align:right}.scroll{overflow:auto}.muted{color:#94a3b8;font-size:12px}@media(max-width:760px){.cards,.stats,.form{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><div id="login" class="overlay"><div class="panel login"><h2>ورود</h2><input id="password" type="password" placeholder="رمز ورود"><button onclick="doLogin()" style="margin-top:8px">ورود</button><div id="err" class="warn"></div></div></div><div class="wrap"><h2>مدیریت سرمایه فیوچرز و Earn</h2><div id="accounts" class="cards"></div><div id="stats" class="stats"></div><div class="panel"><h3>ثبت جریان پول</h3><div class="form"><div><label>تاریخ</label><input id="date" type="date"></div><div><label>صرافی</label><select id="account"><option>Bitunix</option><option>LBank</option><option>Toobit</option></select></div><div><label>نوع عملیات</label><select id="type" onchange="syncFields()"><option value="futures_to_earn">Futures → Earn</option><option value="earn_external_deposit">بیرون → Earn</option><option value="earn_to_wallet">Earn → ولت شخصی</option><option value="earn_balance_update">آپدیت موجودی Earn</option><option value="withdrawal">Futures → ولت شخصی</option><option value="deposit">بیرون → Futures</option><option value="balance_update">آپدیت موجودی Futures</option></select></div><div><label>مبلغ ($)</label><input id="amount" type="number" min="0" step=".01" value="0"></div><div id="fbox"><label>موجودی Futures بعد از عملیات</label><input id="balance" type="number" min="0" step=".01"></div><div id="ebox"><label>موجودی Earn بعد از عملیات</label><input id="earnBalance" type="number" min="0" step=".01"></div><div><label>توضیحات</label><textarea id="note"></textarea></div></div><button onclick="save()" style="margin-top:10px">ثبت اطلاعات</button></div><div class="panel"><h3>تاریخچه و منشأ پول</h3><div class="scroll"><table><thead><tr><th>تاریخ</th><th>صرافی</th><th>مسیر پول</th><th>مبلغ</th><th>Futures بعد</th><th>Earn بعد</th><th>توضیح</th></tr></thead><tbody id="history"></tbody></table></div></div></div><script>const API='https://jumowclgvkhakpwjjhfp.supabase.co/functions/v1/futures-tracker-api';let password=sessionStorage.getItem('futures_password')||'';const q=id=>document.getElementById(id);const money=n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});const labels={futures_to_earn:'Futures → Earn',earn_external_deposit:'بیرون → Earn',earn_to_wallet:'Earn → ولت شخصی',earn_balance_update:'آپدیت Earn',withdrawal:'Futures → ولت شخصی',deposit:'بیرون → Futures',balance_update:'آپدیت Futures'};q('date').value=new Date().toISOString().slice(0,10);async function api(action,data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-app-password':password},body:JSON.stringify({action,data})});const j=await r.json();if(!r.ok)throw Error(j.error||'خطا');return j}async function doLogin(){password=q('password').value;try{await api('summary');sessionStorage.setItem('futures_password',password);q('login').classList.add('hidden');load()}catch(e){q('err').textContent='رمز اشتباه است'}}function syncFields(){const t=q('type').value;const f=['futures_to_earn','withdrawal','deposit','balance_update'].includes(t);const e=['futures_to_earn','earn_external_deposit','earn_to_wallet','earn_balance_update'].includes(t);q('fbox').style.display=f?'block':'none';q('ebox').style.display=e?'block':'none'}async function load(){const d=await api('summary');const f2eAll=d.events.filter(e=>e.event_type==='futures_to_earn');const totalF2E=f2eAll.reduce((s,e)=>s+Number(e.amount||0),0);q('accounts').innerHTML=d.accounts.map(a=>{const st=+a.current_balance>=+a.target_balance?'به هدف رسیده':'در حال رشد';const f2e=d.events.filter(e=>e.event_type==='futures_to_earn'&&e.accounts?.name===a.name);const f2eTotal=f2e.reduce((s,e)=>s+Number(e.amount||0),0);return `<div class="card"><h3>${a.name}</h3><div class="row"><span>Futures</span><b class="big">${money(a.current_balance)}</b></div><div class="row"><span>هدف Futures</span><b>${money(a.target_balance)}</b></div><div class="row"><span>Earn فعلی</span><b class="earn">${money(a.earn_balance)}</b></div><div class="row"><span>Futures → Earn تاریخی</span><b class="earn">${money(f2eTotal)} <span class="muted">(${f2e.length} انتقال)</span></b></div><div class="row"><span>Futures → ولت</span><b>${money(a.total_withdrawn)}</b></div><div class="row"><span>Earn → ولت</span><b>${money(a.earn_withdrawn_to_wallet)}</b></div><div class="row"><span>بیرون → Earn</span><b>${money(a.external_deposited_to_earn)}</b></div><div class="row"><span>قابل برداشت Futures</span><b class="good">${money(a.withdrawable_profit)}</b></div><div class="${st==='در حال رشد'?'warn':'good'}">${st}</div></div>`}).join('');q('stats').innerHTML=`<div class="stat">کل Futures<b>${money(d.totalCurrent)}</b></div><div class="stat">کل Earn<b class="earn">${money(d.totalEarn)}</b></div><div class="stat">کل Futures → Earn<b class="earn">${money(totalF2E)}</b></div><div class="stat">Futures → ولت<b>${money(d.totalWithdrawn)}</b></div><div class="stat">Earn → ولت<b>${money(d.totalEarnToWallet)}</b></div><div class="stat">واریز بیرونی به Earn<b>${money(d.totalExternalToEarn)}</b></div><div class="stat">هدف Futures<b>${money(d.totalTarget)}</b></div><div class="stat">دارایی فعلی صرافی‌ها<b>${money(d.totalCurrent+d.totalEarn)}</b></div><div class="stat">دارایی + خروجی تاریخی<b>${money(d.totalWealth+d.totalEarnToWallet)}</b></div>`;q('history').innerHTML=d.events.map(e=>`<tr><td>${e.event_date}</td><td>${e.accounts?.name||''}</td><td>${labels[e.event_type]||e.event_type}<div class="muted">${e.source_type||''} → ${e.destination_type||''}</div></td><td>${money(e.amount)}</td><td>${e.balance_after==null?'—':money(e.balance_after)}</td><td>${e.earn_balance_after==null?'—':money(e.earn_balance_after)}</td><td>${e.note||''}</td></tr>`).join('')}async function save(){const data={event_date:q('date').value,account_name:q('account').value,event_type:q('type').value,amount:Number(q('amount').value||0),balance_after:q('balance').value===''?null:Number(q('balance').value),earn_balance_after:q('earnBalance').value===''?null:Number(q('earnBalance').value),note:q('note').value.trim()};try{await api('add_event',data);q('amount').value=0;q('balance').value='';q('earnBalance').value='';q('note').value='';await load();alert('ثبت شد')}catch(e){alert(e.message)}}syncFields();if(password){api('summary').then(()=>{q('login').classList.add('hidden');load()}).catch(()=>sessionStorage.clear())}</script></body></html>
